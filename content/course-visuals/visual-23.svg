ns-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">START WITH = 출발 행  /  CONNECT BY PRIOR 사번 = 관리자번호 = 아래로 탐색</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">LEVEL은 시작 행이 1이다. 형제끼리 정렬하려면 ORDER SIBLINGS BY를 사용한다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S12 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">23 / 27</text><rect x="69" y="300" width="502" height="450" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="69" y="300" width="502" height="42" rx="10" fill="#F7F9FC" stroke="none" stroke-width="2"/><text x="84" y="331.16" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="start">사원</text><rect x="69" y="342" width="502" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="116.0" y="375.96000000000004" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="middle">사번</text><text x="254.0" y="375.96000000000004" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="middle">이름</text><text x="458.0" y="375.96000000000004" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="middle">관리자번호</text><rect x="69" y="390" width="94" height="60" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="116.0" y="430.78999999999996" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill