<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>모델링: 현실의 일을 저장 구조로 바꾼다</title><desc>같은 업무를 점점 구체적으로 표현한다. 개념 → 논리 → 물리.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">데이터 모델링</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">02</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">모델링: 현실의 일을 저장 구조로 바꾼다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">같은 업무를 점점 구체적으로 표현한다. 개념 → 논리 → 물리.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">개념 = 무엇과 무엇이 관련?  /  논리 = 어떤 표?  /  물리 = 어떻게 구현?</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">개념·논리·물리의 구체적인 산출물은 방법론에 따라 달라질 수 있다. 아래는 관계형 DB 학습 예시다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S02 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">02 / 27</text><rect x="68" y="273" width="320" height="470" rx="18" fill="#F7F9FC" stroke="#DFE6EE" stroke-width="2"/><text x="90" y="317.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#007D7A" font-weight="700" text-anchor="start">현실 업무</text><rect x="455" y="273" width="320" height="470" rx="18" fill="#F7F9FC" stroke="#DFE6EE" stroke-width="2"/><text x="477" y="317.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#007D7A" font-weight="700" text-anchor="start">개념 모델</text><rect x="842" y="273" width="320" height="470" rx="18" fill="#F7F9FC" stroke="#DFE6EE" stroke-width="2"/><text x="864" y="317.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#007D7A" font-weight="700" text-anchor="start">논리 모델</text><rect x="1229" y="273" width="304" height="470" rx="18" fill="#F7F9FC" stroke="#DFE6EE" stroke-width="2"/><text x="1251" y="317.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#007D7A" font-weight="700" text-anchor="start">물리 모델</text><ellipse cx="224.0" cy="395.0" rx="44.0" ry="44.0" fill="#E8F5F1" stroke="none" stroke-width="2"/><ellipse cx="224.0" cy="380.7" rx="13.200000000000001" ry="13.200000000000001" fill="#FFFFFF" stroke="#007D7A" stroke-width="3"/><path d="M 200.9 420.3 Q 200.9 398.3 224.0 398.3 Q 247.10000000000002 398.3 247.10000000000002 420.3" fill="#FFFFFF" stroke="#007D7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="224.0" y="474.37600000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26.400000000000002" fill="#172B4D" font-weight="700" text-anchor="middle">박강열</text><rect x="111" y="523" width="234" height="40" rx="11" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="228.0" y="550.98" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#007D7A" font-weight="700" text-anchor="middle">DB 과목을 수강</text><text x="228.0" y="669.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#58677F" font-weight="400" text-anchor="middle">업무와 규칙을 듣는다</text><rect x="484" y="374" width="108" height="78" rx="12" fill="#FFFFFF" stroke="#007D7A" stroke-width="2"/><text x="538.0" y="424.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#172B4D" font-weight="700" text-anchor="middle">학생</text><rect x="643" y="374" width="108" height="78" rx="12" fill="#FFFFFF" stroke="#007D7A" stroke-width="2"/><text x="697.0" y="424.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#172B4D" font-weight="700" text-anchor="middle">과목</text><path d="M 592 412 L 643 412" fill="none" stroke="#007D7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="628.0" y="523.98" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#172B4D" font-weight="700" text-anchor="middle">학생이 과목을 수강한다</text><text x="615.0" y="669.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fi