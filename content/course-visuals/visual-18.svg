<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>GROUP BY: 행을 묶은 뒤 그룹 하나로 요약한다</title><desc>WHERE로 행을 먼저 거르고, GROUP BY로 묶고, HAVING으로 그룹을 고른다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">그룹 · 집계</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">18</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">GROUP BY: 행을 묶은 뒤 그룹 하나로 요약한다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">WHERE로 행을 먼저 거르고, GROUP BY로 묶고, HAVING으로 그룹을 고른다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">WHERE = 행 조건  /  GROUP BY = 묶기  /  HAVING = 그룹 조건</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">아래는 논리적 이해 순서다. 실제 실행 계획과 같다고 보장하지 않는다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S09 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">18 / 27</text><rect x="73" y="340" width="465" height="338" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="73" y="340" width="465" height="42" rx="10" fill="#F7F9FC" stroke="none" stroke-width="2"/><text x="88" y="371.16" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="start">원본 4줄</text><rect x="73" y="382" width="465" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="165.5" y="415.545" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#172B4D" font-weight="700" text-anchor="middle">이름</text><text x="330.5" y="415.545" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#172B4D" font-weight="700" text-anchor="middle">과목</text><text x="470.5" y="415.545" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#172B4D" font-weight="700" text-anchor="middle">점수</text><rect x="73" y="430" width="185" height="62" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="165.5" y="471.375" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#172B4D" font-w