<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>트랜잭션: 모두 확정하거나 모두 취소한다</title><desc>10을 보내는 일은 “한쪽에서 빼기 + 다른 쪽에 더하기”가 한 묶음이다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">트랜잭션</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">25</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">트랜잭션: 모두 확정하거나 모두 취소한다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">10을 보내는 일은 “한쪽에서 빼기 + 다른 쪽에 더하기”가 한 묶음이다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">COMMIT = 변경 확정  /  ROLLBACK = 미확정 변경 취소</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">DML만 포함하고 자동 커밋은 꺼진 예시다. 이미 COMMIT한 변경을 일반 ROLLBACK으로 되돌리는 것은 아니다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S13, S01 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">25 / 27</text><rect x="70" y="328" width="370" height="242" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="70" y="328" width="370" height="42" rx="10" fill="#F7F9FC" stroke="none" stroke-width="2"/><text x="85" y="359.16" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="start">시작 (단위: 만원)</text><rect x="70" y="370" width="370" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="162.5" y="404.375" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="middle">계좌</text><text x="347.5" y="404.375" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#172B4D" font-weight="700" text-anchor="middle">잔액</text><rect x="70" y="418" width="185.0" height="76" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="162.5" y="467.205" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="400" text-anchor="middle">박강열</text><rect x="255.0" y="418" width="185.0" height="76" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="347.5" y="467.205" fon