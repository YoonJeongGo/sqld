<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>ERD: 학생–수강–과목을 선으로 연결한다</title><desc>표마다 무엇을 저장하는지, 어느 키로 이어지는지를 먼저 본다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">ERD</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">04</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">ERD: 학생–수강–과목을 선으로 연결한다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">표마다 무엇을 저장하는지, 어느 키로 이어지는지를 먼저 본다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">학생 ↔ 과목의 N:M 관계는 수강표를 두어 두 개의 1:N으로 표현한다.</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">표시 1, 0..N은 이 예시의 관계 규칙이다. 실제 필수·선택 참여는 업무 규칙으로 결정한다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S02, S03 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">04 / 27</text><rect x="77" y="285" width="354" height="219" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="77" y="285" width="354" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="254.0" y="319.78999999999996" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#172B4D" font-weight="700" text-anchor="middle">학생</text><rect x="77" y="333" width="354.0" height="57" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="254.0" y="373.12" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" fill="#172B4D" font-weight="400" text-anchor="middle">학번 PK</text><path d="M 77 333 L 431 333" fill="none" stroke="#DFE6EE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="390" width="354.0" height="57" rx="0" fill="#FBFCFE" stroke="none" stroke-width="2"/><text x="254.0" y="430.12" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" fill="#172B4D" font-weight="400" text-anchor="middle">이름</text><path d="M 77 390 L 431 390" fill="none" stroke="#DFE6EE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="447" width="354.0" height="57" rx="0" fill="#FFFFFF" stroke="non