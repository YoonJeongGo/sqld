<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>DCL: 데이터가 아니라 사용 권한을 바꾼다</title><desc>같은 학생표를 두고, 조회할 수 있는 열쇠를 주거나 거둔다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">권한 관리</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">26</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">DCL: 데이터가 아니라 사용 권한을 바꾼다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">같은 학생표를 두고, 조회할 수 있는 열쇠를 주거나 거둔다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">GRANT = 권한 부여  /  REVOKE = 그 권한 회수</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">PARK는 박상현의 예시 계정명이다. 다른 계정·역할 등을 통해 받은 추가 권한은 없다고 가정한다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S14 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">26 / 27</text><rect x="72" y="252" width="699" height="455" rx="18" fill="#E8F5F1" stroke="#DFE6EE" stroke-width="2"/><text x="94" y="296.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#007D7A" font-weight="700" text-anchor="start">① 조회 권한을 준 뒤</text><rect x="829" y="252" width="699" height="455" rx="18" fill="#FFF5E7" stroke="#DFE6EE" stroke-width="2"/><text x="851" y="296.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#AE5E00" font-weight="700" text-anchor="start">② 그 권한을 회수한 뒤</text><ellipse cx="174.0" cy="415.0" rx="40.0" ry="40.0" fill="#E8F5F1" stroke="none" stroke-width="2"/><ellipse cx="174.0" cy="402.0" rx="12.0" ry="12.0" fill="#FFFFFF" stroke="#007D7A" stroke-width="3"/><path d="M 153.0 438.0 Q 153.0 418.0 174.0 418.0 Q 195.0 418.0 195.0 438.0" fill="#FFFFFF" stroke="#007D7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="174.0" y="487.16" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24.0" fill="#172B4D" font-weight="700" text-anchor="middle">관리자</text><ellipse cx="454.0" cy="415.0" rx="40.0" ry="40.0" fill="#E8F5F1" stroke="none" stroke-width="2"/><ellipse cx="454.0" cy="402.0" rx=