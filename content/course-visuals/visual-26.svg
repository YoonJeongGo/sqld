" fill="#FFFFFF" font-weight="400" text-anchor="start">REVOKE SELECT ON 학생 FROM PARK;</text><text x="419.5" y="662.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="middle">학생표의 데이터는 그대로</text><text x="1172.5" y="662.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="middle">회수되는 것은 조회 권한</text></svg>