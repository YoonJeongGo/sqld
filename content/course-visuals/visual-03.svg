<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>스키마 3단계: 같은 DB를 보는 세 관점</title><desc>사용자에게 보이는 모습과, 전체 구조와, 저장 방식을 나누어 생각한다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">데이터 모델링</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">03</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">스키마 3단계: 같은 DB를 보는 세 관점</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">사용자에게 보이는 모습과, 전체 구조와, 저장 방식을 나누어 생각한다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">외부 = 사용자별  /  개념 = DB 전체  /  내부 = 물리적 저장</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">위아래는 관점의 단계다. SQL이 이 순서로 실행된다는 그림이 아니다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S16 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">03 / 27</text><rect x="76" y="257" width="219" height="40" rx="11" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="185.5" y="284.98" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#007D7A" font-weight="700" text-anchor="middle">외부 스키마</text><rect x="76" y="473" width="219" height="40" rx="11" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="185.5" y="500.98" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#007D7A" font-weight="700" text-anchor="middle">개념 스키마</text><rect x="76" y="680" width="219" height="40" rx="11" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="185.5" y="707.98" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#007D7A" font-weight="700" text-anchor="middle">내부 스키마</text><rect x="367" y="244" width="421" height="146" rx="18" fill="#ECF2FF" stroke="#DFE6EE" stroke-width="2"/><text x="389" y="288.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#315CAA" font-weight="700" text-anchor="start">학생용 화면</text><text x="577.5" y="335.52" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" fill="#172B4D" font-weight="400" text-anchor="middle">이름 · 수강과목 · 점수</text><rect x="825" y="244" width="421" height="146" rx="18" fill="#ECF2FF" stroke="#DFE6EE" stroke-width="2"/><text x="847" y="288.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#315CAA" font-weight="700" text-anchor="start">학사 담당자용 화면</text><text x="1035.5" y="335.52" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="28" fill="#172B4D" font-weight="400" text-anchor="middle">학번 · 이름 · 연락처</text><path d="M 577 394 L 577 444 L 800 444 L 800 463" fill="none" stroke="#315CAA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 793.0405514542203 448.5928463623572 L 800 463 L 806.9594485457797 448.5928463623572" fill="none" stroke="#315CAA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1036 394 L 1036 444 L 800 444" fill="none" stroke="#315CAA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="367" y="470" width="879" height="132" rx="18" fill="#E8F5F1" stroke="#DFE6EE" stroke-width="2"/><text x="389" y="514.34" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#007D7A" font-weight="700" text-anchor="start">전체 논리 구조</text><text x="806.5" y="562.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#172B4D" font-weight="700" text-anchor="middle">학생표  ─  수강표  ─  과목표</text><path d="M 802 607 L 802 658" fill="none" stroke="#007D7A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 795.0405514542203 643.5928463623571 L 802 658 L 808.9594485457797 643.5928463623571" fill="none" stroke="#007D7A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="367" y="668" width="879" height="155" rx="18" fill="#F7F9FC" stroke="#DFE6EE" stroke-width="2"/><path d="M 411 707.98 L 411 765.02 C 411 786.3266666666667 505 786.3266666666667 505 765.02 L 505 707.98" fill="#E8F5F