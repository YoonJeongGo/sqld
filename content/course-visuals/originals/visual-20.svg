<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>CUBE: 가능한 묶음 조합을 모두 집계한다</title><desc>같은 매출 데이터로 지역별·과목별·전체 합계를 함께 만든다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">고급 집계</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">20</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">CUBE: 가능한 묶음 조합을 모두 집계한다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">같은 매출 데이터로 지역별·과목별·전체 합계를 함께 만든다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">CUBE(지역, 과목) = (지역, 과목) + (지역) + (과목) + ()</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">두 열의 2² = 4는 집계 조합 수다. 여기서는 각 조합의 행이 4 + 2 + 2 + 1 = 9줄이다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S09 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">20 / 27</text><rect x="74" y="250" width="656" height="326" rx="18" fill="#ECF2FF" stroke="#DFE6EE" stroke-width="2"/><text x="96" y="294.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#315CAA" font-weight="700" text-anchor="start">① (지역, 과목) : 상세 4줄</text><rect x="94" y="309" width="616" height="216" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="94" y="309" width="616" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="196.66666666666669" y="342.545" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#172B4D" font-weight="700" text-anchor="middle">지역</text><text x="402.00000000000006" y="342.545" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#172B4D" font-weight="700" text-anchor="middle">과목</text><text x="607.3333333333334" y="342.545" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#172B4D" font-weight="700" text-anchor="middle">합계</text><rect x="94" y="357" width="205.33333333333334" height="42" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="196.66666666666669" y="388.375" font-family="Noto Sans CJK KR,Noto Sans KR