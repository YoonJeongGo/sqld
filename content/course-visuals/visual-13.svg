<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>INNER JOIN: 조건이 맞는 행끼리 짝짓기</title><desc>학번이 같은 경우만 연결한다. 한 학생이 여러 과목과 연결될 수도 있다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">조인</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">13</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">INNER JOIN: 조건이 맞는 행끼리 짝짓기</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">학번이 같은 경우만 연결한다. 한 학생이 여러 과목과 연결될 수도 있다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">같은 연결 값이 여러 행에 있으면, 한 행도 여러 결과 행으로 늘어난다.</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">이름은 표시용이다. 이 예시의 연결 조건은 학생.학번 = 수강.학번이다. 결과 정렬은 설명용이다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S07 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">13 / 27</text><rect x="74" y="252" width="555" height="279" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="74" y="252" width="555" height="42" rx="10" fill="#F7F9FC" stroke="none" stroke-width="2"/><text x="89" y="283.16" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="start">학생</text><rect x="74" y="294" width="555" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="212.75" y="329.205" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="middle">학번</text><text x="490.25" y="329.205" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="middle">이름</text><rect x="74" y="342" width="277.5" height="63" rx="0" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="212.75" y="385.535" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" fill="#172B4D" font-weight="400" text-anchor="middle">1001</text><rect x="351.5" y="342" width="277.5" height="63" rx="0" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="490.25" y="385.535" font-family="Noto S