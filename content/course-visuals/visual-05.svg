<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>속성은 항목, 튜플은 정보 한 줄 전체</title><desc>어떤 것들을 세는지 표 위에서 직접 확인한다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">릴레이션 기초</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">05</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">속성은 항목, 튜플은 정보 한 줄 전체</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">어떤 것들을 세는지 표 위에서 직접 확인한다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">속성 4개 → 차수 4  /  정보 3줄 → 카디널리티 3</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">이름만 튜플이 아니다. 학번·이름·학과·학년의 값이 함께 있는 한 줄 전체가 튜플이다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S01 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">05 / 27</text><rect x="85" y="246" width="461" height="40" rx="11" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="315.5" y="273.98" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#007D7A" font-weight="700" text-anchor="middle">학생 엔터티를 학생표로 표현</text><rect x="84" y="395" width="980" height="300" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="84" y="395" width="980" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="206.5" y="431.035" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="middle">학번</text><text x="451.5" y="431.035" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="middle">이름</text><text x="696.5" y="431.035" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="middle">학과</text><text x="941.5" y="431.035" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="middle">학년</text><rect x="84" y="443" width="245.0" height="84" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="206.5