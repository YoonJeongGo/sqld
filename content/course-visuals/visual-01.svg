<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>DBMS는 중간에서 데이터를 관리한다</title><desc>사용자는 요청하고, DBMS는 처리하고, 데이터베이스는 데이터를 담는다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">기초 개념</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">01</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">DBMS는 중간에서 데이터를 관리한다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">사용자는 요청하고, DBMS는 처리하고, 데이터베이스는 데이터를 담는다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">DB = 데이터 모음  /  DBMS = 그것을 관리하는 소프트웨어</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">원통은 데이터 저장소를 나타내는 기호이며, 실제 저장 장치의 모양이라는 뜻은 아니다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S01 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">01 / 27</text><rect x="72" y="249" width="350" height="460" rx="18" fill="#F7F9FC" stroke="#DFE6EE" stroke-width="2"/><text x="94" y="293.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#007D7A" font-weight="700" text-anchor="start">사용자 · 프로그램</text><ellipse cx="246.0" cy="384.0" rx="54.0" ry="54.0" fill="#E8F5F1" stroke="none" stroke-width="2"/><ellipse cx="246.0" cy="366.45" rx="16.200000000000003" ry="16.200000000000003" fill="#FFFFFF" stroke="#007D7A" stroke-width="3"/><path d="M 217.65 415.05 Q 217.65 388.05 246.0 388.05 Q 274.35 388.05 274.35 415.05" fill="#FFFFFF" stroke="#007D7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="246.0" y="481.41600000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32.400000000000006" fill="#172B4D" font-weight="700" text-anchor="middle">양지훈</text><rect x="135" y="521" width="225" height="118" rx="12" fill="#FFFFFF" stroke="#172B4D" stroke-width="4"/><rect x="155" y="540" width="185" height="72" rx="4" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="247.0" y="586.61" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="middle