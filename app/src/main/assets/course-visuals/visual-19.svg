<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>ROLLUP: 오른쪽 항목부터 접어 소계를 만든다</title><desc>지역·과목별 금액 → 지역별 소계 → 전체 합계.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">고급 집계</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">19</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">ROLLUP: 오른쪽 항목부터 접어 소계를 만든다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">지역·과목별 금액 → 지역별 소계 → 전체 합계.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">ROLLUP(지역, 과목) = (지역, 과목) + (지역) + ()</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">n+1은 집계 단계 수다. 결과 행 수가 아니다. 이 그림에서 NULL은 소계·총계 때문에 생략된 값이다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S09 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">19 / 27</text><rect x="75" y="241" width="1450" height="61.699999999999996" rx="12" fill="#172B4D" stroke="none" stroke-width="2"/><text x="92" y="279.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#FFFFFF" font-weight="400" text-anchor="start">SELECT 지역, 과목, SUM(금액) FROM 매출 GROUP BY ROLLUP(지역, 과목);</text><rect x="84" y="354" width="354" height="160" rx="18" fill="#ECF2FF" stroke="#DFE6EE" stroke-width="2"/><text x="106" y="398.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#315CAA" font-weight="700" text-anchor="start">① 상세: 4줄</text><text x="101" y="432.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#172B4D" font-weight="700" text-anchor="start">서울: DB 10 · JAVA 20</text><text x="101" y="463.12" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#172B4D" font-weight="700" text-anchor="start">부산: DB 30 · JAVA 40</text><path d="M 263 526 L 263 558 L 531 558 L 531 580" fill="none" stroke="#007D7A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 524.0405514542203 565.5928463623571 L 531 580 L 537.9594485457797 565.5928463623571" fill="none" st