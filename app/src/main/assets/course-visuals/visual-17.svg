<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>서브쿼리: 전체 기준과 현재 행의 기준을 구분</title><desc>전체 평균을 쓰는가, 지금 보는 사람의 부서 평균을 쓰는가?</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">SQL 활용</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">17</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">서브쿼리: 전체 기준과 현재 행의 기준을 구분</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">전체 평균을 쓰는가, 지금 보는 사람의 부서 평균을 쓰는가?</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">비상관 = 바깥 행을 참조하지 않음  /  상관 = 현재 바깥 행의 값을 참조</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">이 그림은 의미를 따라가는 설명이다. DBMS의 실제 실행 순서·반복 횟수는 최적화로 달라질 수 있다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S08 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">17 / 27</text><rect x="476" y="234" width="650" height="212" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="476" y="234" width="650" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="584.3333333333334" y="267.13" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#172B4D" font-weight="700" text-anchor="middle">이름</text><text x="801.0" y="267.13" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#172B4D" font-weight="700" text-anchor="middle">부서</text><text x="1017.6666666666666" y="267.13" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#172B4D" font-weight="700" text-anchor="middle">점수</text><rect x="476" y="282" width="216.66666666666666" height="41" rx="0" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="584.3333333333334" y="312.46000000000004" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="400" text-anchor="middle">양지훈</text><rect x="692.6666666666666" y="282" width="216.66666666666666" height="41" rx="0" fill="#E8F5F1" stroke="none" stroke-width="2"/><text x="801.0" y="312.46000000000004" font-family="Noto Sans CJK K