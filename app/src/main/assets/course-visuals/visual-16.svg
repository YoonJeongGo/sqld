<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>SELF JOIN: 같은 사원표를 두 역할로 읽는다</title><desc>E는 사원 쪽, M은 관리자 쪽이다. 표를 두 개 새로 만드는 것이 아니다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">조인</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">16</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">SELF JOIN: 같은 사원표를 두 역할로 읽는다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">E는 사원 쪽, M은 관리자 쪽이다. 표를 두 개 새로 만드는 것이 아니다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">E.관리자번호 = M.사번  →  사원 이름과 그 관리자의 이름을 연결</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">아래 결과는 INNER SELF JOIN이다. 관리자번호가 NULL인 최상위 관리자 장정훈은 결과에서 빠진다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S07 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">16 / 27</text><rect x="70" y="347" width="610" height="398" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="70" y="347" width="610" height="42" rx="10" fill="#F7F9FC" stroke="none" stroke-width="2"/><text x="85" y="378.16" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="start">사원: 이 표 하나를 E와 M으로 사용</text><rect x="70" y="389" width="610" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="122.5" y="423.78999999999996" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#172B4D" font-weight="700" text-anchor="middle">사번</text><text x="292.5" y="423.78999999999996" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#172B4D" font-weight="700" text-anchor="middle">이름</text><text x="545.0" y="423.78999999999996" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#172B4D" font-weight="700" text-anchor="middle">관리자번호</text><rect x="70" y="437" width="105" height="77" rx="0" fill="#FFF5E7" stroke="none" stroke-width="2"/><text x="122.5" y="487.12" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-s