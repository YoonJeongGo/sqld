<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>PK는 구별하고, FK는 다른 표를 참조한다</title><desc>같은 번호끼리 연결해 보면 역할이 보인다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">키 · 식별자</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">06</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">PK는 구별하고, FK는 다른 표를 참조한다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">같은 번호끼리 연결해 보면 역할이 보인다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">PK = 내 표의 한 줄 식별  /  FK = 다른 표의 키 값 참조</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">FK는 이 예시처럼 반복될 수 있다. NULL 허용 여부는 별도의 NOT NULL 제약 등으로 결정한다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S03, S07 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">06 / 27</text><rect x="81" y="317" width="537" height="260" rx="12" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="2"/><rect x="81" y="317" width="537" height="42" rx="10" fill="#F7F9FC" stroke="none" stroke-width="2"/><text x="96" y="348.16" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" fill="#172B4D" font-weight="700" text-anchor="start">학생</text><rect x="81" y="359" width="537" height="48" rx="0" fill="#ECF2FF" stroke="none" stroke-width="2"/><text x="215.25" y="395.035" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="middle">학번 PK</text><text x="483.75" y="395.035" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="middle">이름</text><rect x="81" y="407" width="268.5" height="85" rx="0" fill="#FFF5E7" stroke="none" stroke-width="2"/><text x="215.25" y="462.365" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="31" fill="#172B4D" font-weight="400" text-anchor="middle">1001</text><rect x="349.5" y="407" width="268.5" height="85" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="483.75" y="462.365" font-family="Noto Sans CJK KR,Noto Sans KR