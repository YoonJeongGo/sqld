<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>NULL은 0점이 아니다</title><desc>0은 실제 값이다. NULL은 값이 없거나 알 수 없음을 나타낸다.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007D7A" stroke="none" stroke-width="2"/><text x="64" y="56.8" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="20" fill="#007D7A" font-weight="700" text-anchor="start">SQLD  /  표로 이해하는 데이터베이스</text><text x="1500" y="55.620000000000005" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" fill="#58677F" font-weight="400" text-anchor="end">SQL 기본</text><rect x="64" y="91" width="68" height="68" rx="19" fill="#007D7A" stroke="none" stroke-width="2"/><text x="98.0" y="137.88" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">12</text><text x="154" y="138.14" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="46" fill="#172B4D" font-weight="700" text-anchor="start">NULL은 0점이 아니다</text><text x="154" y="181.25" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="25" fill="#58677F" font-weight="400" text-anchor="start">0은 실제 값이다. NULL은 값이 없거나 알 수 없음을 나타낸다.</text><path d="M 64 209 L 1536 209" fill="none" stroke="#DFE6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="863" width="1472" height="66" rx="16" fill="#E8F5F1" stroke="none" stroke-width="2"/><rect x="80" y="878" width="86" height="36" rx="10" fill="#007D7A" stroke="none" stroke-width="2"/><text x="123.0" y="904.07" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">기억</text><text x="187" y="908.43" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">COUNT(*)는 행 전체  /  COUNT(점수)·AVG(점수)는 NULL 제외</text><text x="66" y="961.71" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="19" fill="#58677F" font-weight="400" text-anchor="start">Oracle 19c는 길이 0인 문자열을 NULL로 취급한다. 공백 한 글자와 숫자 0은 NULL이 아니다.</text><text x="66" y="988.17" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="13" fill="#58677F" font-weight="400" text-anchor="start">이름·수치: 학습용 가상 예시  |  S06 · 출처목록 참조</text><text x="1536" y="988.44" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" fill="#007D7A" font-weight="700" text-anchor="end">12 / 27</text><rect x="73" y="252" width="448" height="235" rx="18" fill="#E8F5F1" stroke="#DFE6EE" stroke-width="2"/><text x="95" y="296.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#007D7A" font-weight="700" text-anchor="start">점수를 알고 있다</text><text x="297.0" y="402.48" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="72" fill="#007D7A" font-weight="700" text-anchor="middle">90</text><rect x="576" y="252" width="448" height="235" rx="18" fill="#ECF2FF" stroke="#DFE6EE" stroke-width="2"/><text x="598" y="296.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#315CAA" font-weight="700" text-anchor="start">0점으로 기록했다</text><text x="800.0" y="402.48" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="72" fill="#315CAA" font-weight="700" text-anchor="middle">0</text><rect x="1079" y="252" width="448" height="235" rx="18" fill="#FFF5E7" stroke="#DFE6EE" stroke-width="2"/><text x="1101" y="296.34000000000003" font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif" font-size="26" fill="#AE5E00" font-weight="700" text-anchor="start">값이 없다 · 알 수 없다</text><text x="1303.0" y="402.48" font-fam